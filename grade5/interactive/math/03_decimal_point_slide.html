<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Decimal Point Slide — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #00695c; --ia-accent-2: #e0f2f1; }
    .pv { width: 100%; max-width: 620px; border: 3px solid #80cbc4; border-radius: 14px; overflow: hidden; background: #fff; }
    .pv-head { display: grid; grid-template-columns: repeat(7, 1fr); background: #e0f2f1; }
    .pv-head div { text-align: center; font-size: clamp(10px, 2.2vw, 14px); font-weight: bold; color: #00695c; padding: 6px 0; border-right: 1px solid #b2dfdb; }
    .pv-head div.dec { background: #fff3e0; color: #d84315; }
    .pv-body { position: relative; height: clamp(60px, 13vw, 84px); background-image: linear-gradient(90deg, #b2dfdb 1px, transparent 1px); background-size: calc(100% / 7) 100%; }
    .tile { position: absolute; top: 8%; height: 84%; width: calc(100% / 7); display: flex; align-items: center; justify-content: center; font-size: clamp(28px, 7vw, 48px); font-weight: bold; color: #263238; transition: transform .6s ease, opacity .35s ease; }
    .tile.ph { color: #9e9e9e; }
    .tile.fade { opacity: 0; }
    .tile.enter { animation: tIn .35s ease; }
    @keyframes tIn { from { opacity: 0; } to { opacity: 1; } }
    .dp { position: absolute; left: calc(400% / 7); bottom: 8px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #d84315; z-index: 2; }
    .readout { font-size: clamp(20px, 4vw, 28px); font-weight: bold; color: #00695c; text-align: center; min-height: 34px; }
    .slider-row .ia-btn { min-width: 88px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  // Values are whole numbers of MILLIONTHS (10^-6), so all arithmetic is exact integer arithmetic.
  var SC = 6;
  function pow10(n) { var x = 1; while (n-- > 0) x *= 10; return x; }
  function fmt(V) {
    var s = String(V); while (s.length <= SC) s = '0' + s;
    var w = s.slice(0, -SC), f = s.slice(-SC).replace(/0+$/, '');
    w = w.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return w + (f ? '.' + f : '');
  }
  function nzRange(V) { // [highest, lowest] place of non-zero digits (0 = ones, -1 = tenths …)
    var s = String(V), L = s.length, hi = null, lo = null;
    for (var i = 0; i < L; i++) if (s[i] !== '0') { var p = L - 1 - i - SC; if (hi === null) hi = p; lo = p; }
    return [hi, lo];
  }
  function inChart(V) { if (!(V > 0)) return false; var r = nzRange(V); return r[0] <= 3 && r[1] >= -3; }
  function digitAt(V, pos) { return Math.floor(V / pow10(pos + SC)) % 10; }
  function scale(V, m) { // ×10^m, or null if not a whole number of millionths
    if (m >= 0) return V * pow10(m);
    var d = pow10(-m); return V % d === 0 ? V / d : null;
  }

  function Chart() {
    var names = [['Thousands', 'Th'], ['Hundreds', 'H'], ['Tens', 'T'], ['Ones', 'O'], ['tenths', 't'], ['hundredths', 'h'], ['thousandths', 'th']];
    var narrow = window.innerWidth < 560;
    var head = IA.el('div', { class: 'pv-head' }, names.map(function (n, i) { return IA.el('div', { class: i > 3 ? 'dec' : '' }, [narrow ? n[1] : n[0]]); }));
    var body = IA.el('div', { class: 'pv-body' }, [IA.el('div', { class: 'dp', 'aria-hidden': 'true' })]);
    var el = IA.el('div', { class: 'pv', role: 'img' }, [head, body]);
    var tiles = [], busy = false, value = null;
    function render(V, enter) {
      tiles.forEach(function (t) { t.remove(); }); tiles = [];
      value = V; el.setAttribute('aria-label', 'Place value chart showing ' + fmt(V));
      var r = nzRange(V), hi = Math.max(r[0], 0), lo = Math.min(r[1], 0);
      for (var p = hi; p >= lo; p--) {
        var core = p <= r[0] && p >= r[1];
        var t = IA.el('div', { class: 'tile' + (core ? '' : ' ph') + (enter && !core ? ' enter' : ''), style: { left: ((3 - p) * 100 / 7) + '%' } }, [String(digitAt(V, p))]);
        t._core = core; tiles.push(t); body.appendChild(t);
      }
    }
    function slide(m, done) { // m > 0: ×10^m (digits move left)
      var N = scale(value, m);
      if (busy || N === null || !inChart(N)) return false;
      busy = true;
      tiles.forEach(function (t) {
        if (t._core) t.style.transform = 'translateX(' + (-m * 100) + '%)'; else t.classList.add('fade');
      });
      setTimeout(function () { render(N, true); busy = false; if (done) done(N); }, 650);
      return true;
    }
    return { el: el, render: render, slide: slide, get: function () { return value; }, busy: function () { return busy; } };
  }

  function makeRound(dir) {
    for (var guard = 0; guard < 500; guard++) {
      var k = IA.rand(1, 3), n = IA.rand(1, 3);
      var sig = IA.rand(pow10(n - 1), pow10(n) - 1);
      if (sig % 10 === 0) continue;
      var e = IA.rand(-3, 3 - (n - 1));
      if (dir > 0 && e >= 0) continue;
      if (e + dir * k < -3 || e + n - 1 + dir * k > 3) continue;
      var V = sig * pow10(e + SC);
      var ans = scale(V, dir * k);
      if (ans === null || !inChart(V) || !inChart(ans)) continue;
      var opts = [ans], seen = {}; seen[ans] = 1;
      [dir * (k + 1), -dir * k, dir * (k - 1), dir * (k + 2), -dir * (k + 1)].forEach(function (m) {
        if (opts.length >= 4 || m === 0) return;
        var x = scale(V, m);
        if (x !== null && x > 0 && x < 1e15 && !seen[x]) { seen[x] = 1; opts.push(x); }
      });
      if (opts.length < 4) continue;
      return { V: V, k: k, dir: dir, ans: ans, opts: IA.shuffle(opts) };
    }
  }

  IA.game({
    id: 'g5m-decimal-point-slide',
    title: 'Decimal Point Slide',
    emoji: '🛝',
    back: '../index.html',
    instructions: 'The decimal point stays put — the digits slide! Use ×10 and ÷10 to explore, then pick the answer.',
    rounds: 10,
    delay: 1600,
    levelTitle: 'Choose a level',
    levels: [
      { label: '× 10, 100, 1000', value: 'mul', desc: 'Digits slide left — with the slider' },
      { label: '÷ 10, 100, 1000', value: 'div', desc: 'Digits slide right — with the slider' },
      { label: 'Mixed challenge', value: 'mix', desc: 'No slider until you need a hint' }
    ],
    round: function (r) {
      var dir = r.level === 'mul' ? 1 : r.level === 'div' ? -1 : (Math.random() < .5 ? 1 : -1);
      var q = makeRound(dir);
      var opName = (dir > 0 ? '× ' : '÷ ') + ['', '10', '100', '1,000'][q.k];
      r.stage.appendChild(IA.el('div', { class: 'ia-prompt' }, [fmt(q.V) + ' ' + opName + ' = ?']));
      var chart = Chart(); chart.render(q.V);
      r.stage.appendChild(chart.el);
      var steps = [];
      var readout = IA.el('div', { class: 'readout' }, [fmt(q.V)]);
      function upd() { readout.textContent = fmt(q.V) + (steps.length ? ' ' + steps.join(' ') + ' = ' + fmt(chart.get()) : ''); refresh(); }
      function press(m, label) {
        if (chart.slide(m, function () { upd(); })) { IA.sfx.tap(); steps.push(label); }
      }
      var bMul = IA.el('button', { class: 'ia-btn', type: 'button', onclick: function () { press(1, '× 10'); } }, ['× 10']);
      var bDiv = IA.el('button', { class: 'ia-btn', type: 'button', onclick: function () { press(-1, '÷ 10'); } }, ['÷ 10']);
      var bReset = IA.el('button', { class: 'ia-btn', type: 'button', 'aria-label': 'Start again', onclick: function () { steps = []; chart.render(q.V, true); upd(); } }, ['↺']);
      function refresh() {
        var v = chart.get();
        var a = scale(v, 1), b = scale(v, -1);
        bMul.disabled = !(a !== null && inChart(a));
        bDiv.disabled = !(b !== null && inChart(b));
      }
      var slider = IA.el('div', { class: 'ia-col slider-row' + (r.level === 'mix' ? ' hidden' : '') }, [readout, IA.el('div', { class: 'ia-row' }, [bMul, bDiv, bReset])]);
      r.stage.appendChild(slider);
      refresh();
      var hint = IA.el('div', { class: 'ia-hint hidden' });
      IA.choices(r, r.stage, q.opts, q.ans, {
        render: function (v) { return fmt(v); },
        isCorrect: function (v) {
          if (v === q.ans) {
            var now = chart.get();
            if (now !== q.ans && !chart.busy()) {
              steps = [];
              var m = 0, x = q.V; chart.render(q.V);
              while (x !== q.ans && Math.abs(m) < 4) { m += dir; x = scale(q.V, m); }
              chart.slide(m, function () { readout.textContent = fmt(q.V) + ' ' + opName + ' = ' + fmt(q.ans); refresh(); });
            }
            slider.classList.remove('hidden');
            return true;
          }
          slider.classList.remove('hidden');
          hint.classList.remove('hidden');
          hint.textContent = opName + ' moves every digit ' + q.k + ' place' + (q.k > 1 ? 's' : '') + ' to the ' + (dir > 0 ? 'LEFT (the number gets bigger)' : 'RIGHT (the number gets smaller)') + '. Try the ' + (dir > 0 ? '× 10' : '÷ 10') + ' button ' + q.k + ' time' + (q.k > 1 ? 's' : '') + '!';
          return false;
        }
      });
      r.stage.appendChild(hint);
    }
  });
</script>
</body>
</html>
