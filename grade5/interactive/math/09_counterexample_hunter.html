<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Counterexample Hunter — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #00695c; --ia-accent-2: #e0f2f1; }
    .claim { width: 100%; max-width: 640px; background: #fffdf3; border: 3px solid #f0c040; border-radius: 18px; padding: 18px 20px; text-align: center; }
    .claim .tag { font-size: 14px; color: #8a6d00; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
    .claim .txt { font-size: clamp(21px, 4vw, 30px); font-weight: bold; color: #333; margin-top: 6px; }
    .verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
    .verdicts .ia-btn { min-height: 72px; }
    .verdicts .ia-btn.chosen { outline: 4px solid #f0c040; }
    .hunt { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .inputs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 22px; font-weight: bold; }
    .inputs .ia-input { width: 120px; }
    .log { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 6px; }
    .log div { padding: 8px 12px; border-radius: 10px; font-size: 17px; }
    .log .fits { background: #eef6ff; color: #1a4f8a; }
    .log .nope { background: #fff3e0; color: #8d4a00; }
    .log .cx { background: #e8f5e9; color: #1b5e20; font-weight: bold; }
    .why { background: #e0f2f1; border: 2px solid #80cbc4; border-radius: 14px; padding: 10px 14px; font-size: 17px; max-width: 640px; color: #004d40; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  function isPrime(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
  function isSquare(n) { var r = Math.round(Math.sqrt(n)); return r * r === n; }
  function eo(n) { return n % 2 === 0 ? 'even' : 'odd'; }
  function odd(n) { return n % 2 === 1; }
  function even(n) { return n % 2 === 0; }

  // Each claim: text, vars (input labels), dom(values) -> null or reason it is outside the claim,
  // holds(values) -> does the claim work for these values, show(values) -> what happens, why: explanation.
  var CLAIMS = [
    { text: 'All prime numbers are odd.', vars: ['n'], truth: false,
      dom: function (v) { return isPrime(v[0]) ? null : v[0] + ' is not a prime number, so it does not test this claim.'; },
      holds: function (v) { return odd(v[0]); }, show: function (v) { return v[0] + ' is prime and ' + eo(v[0]) + '.'; },
      hint: 'Check the very smallest prime numbers.', why: '2 is prime but even. One counterexample is enough to show a claim is false.' },
    { text: 'The sum of two odd numbers is odd.', vars: ['a', 'b'], truth: false,
      dom: function (v) { return odd(v[0]) && odd(v[1]) ? null : 'Both numbers must be odd.'; },
      holds: function (v) { return odd(v[0] + v[1]); }, show: function (v) { return v[0] + ' + ' + v[1] + ' = ' + (v[0] + v[1]) + ', which is ' + eo(v[0] + v[1]) + '.'; },
      hint: 'Try 3 + 5.', why: 'Odd + odd is always even: the two leftover dots join to make a pair.' },
    { text: 'Every multiple of 4 is also a multiple of 8.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] > 0 && v[0] % 4 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 4.'; },
      holds: function (v) { return v[0] % 8 === 0; }, show: function (v) { return v[0] + ' = 4 × ' + (v[0] / 4) + (v[0] % 8 === 0 ? ', and it is also 8 × ' + (v[0] / 8) + '.' : ', but 8 does not go into it evenly.'); },
      hint: 'List the multiples of 4: 4, 8, 12, 16, …', why: '4, 12, 20, … are multiples of 4 but not of 8.' },
    { text: 'Every number that ends in 3 is prime.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] % 10 === 3 ? null : v[0] + ' does not end in 3.'; },
      holds: function (v) { return isPrime(v[0]); }, show: function (v) { return v[0] + (isPrime(v[0]) ? ' is prime.' : ' is not prime (' + v[0] + ' = ' + smallFactor(v[0]) + ' × ' + (v[0] / smallFactor(v[0])) + ').'); },
      hint: 'Is 33 prime? What about 63?', why: '33 = 3 × 11 ends in 3 but is not prime. The last digit alone does not make a number prime.' },
    { text: 'When you multiply two whole numbers, the answer is bigger than both of them.', vars: ['a', 'b'], truth: false,
      dom: function () { return null; },
      holds: function (v) { var p = v[0] * v[1]; return p > v[0] && p > v[1]; }, show: function (v) { return v[0] + ' × ' + v[1] + ' = ' + (v[0] * v[1]) + '.'; },
      hint: 'What happens when you multiply by 1 or by 0?', why: 'Multiplying by 1 or 0 does not make a bigger number: 5 × 1 = 5 and 5 × 0 = 0.' },
    { text: 'All odd numbers are prime.', vars: ['n'], truth: false,
      dom: function (v) { return odd(v[0]) ? null : v[0] + ' is even, so it does not test this claim.'; },
      holds: function (v) { return isPrime(v[0]); }, show: function (v) { return v[0] + (isPrime(v[0]) ? ' is odd and prime.' : ' is odd but not prime.'); },
      hint: 'Think about 9 or 15.', why: '9 = 3 × 3 is odd but not prime (and 1 is not prime either).' },
    { text: 'Every multiple of 3 is odd.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] > 0 && v[0] % 3 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 3.'; },
      holds: function (v) { return odd(v[0]); }, show: function (v) { return v[0] + ' is a multiple of 3 and it is ' + eo(v[0]) + '.'; },
      hint: 'Count by 3s: 3, 6, 9, …', why: '6 = 3 × 2 is a multiple of 3 and it is even.' },
    { text: 'The product of two whole numbers is always even.', vars: ['a', 'b'], truth: false,
      dom: function () { return null; },
      holds: function (v) { return even(v[0] * v[1]); }, show: function (v) { return v[0] + ' × ' + v[1] + ' = ' + (v[0] * v[1]) + ', which is ' + eo(v[0] * v[1]) + '.'; },
      hint: 'Try two odd numbers.', why: 'Odd × odd is odd, e.g. 3 × 5 = 15.' },
    { text: 'Every multiple of 5 ends in 5.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] > 0 && v[0] % 5 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 5.'; },
      holds: function (v) { return v[0] % 10 === 5; }, show: function (v) { return v[0] + ' is a multiple of 5 and it ends in ' + (v[0] % 10) + '.'; },
      hint: 'Count by 5s: 5, 10, 15, …', why: 'Multiples of 5 end in 5 or 0, so 10 breaks the claim.' },
    { text: 'Every square number (1, 4, 9, 16, …) is even.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] > 0 && isSquare(v[0]) ? null : v[0] + ' is not a square number.'; },
      holds: function (v) { return even(v[0]); }, show: function (v) { var s = Math.round(Math.sqrt(v[0])); return v[0] + ' = ' + s + ' × ' + s + ', which is ' + eo(v[0]) + '.'; },
      hint: 'Look at the list in the claim!', why: '9 = 3 × 3 is a square number and it is odd.' },
    { text: 'Every number bigger than 10 has more than two factors.', vars: ['n'], truth: false,
      dom: function (v) { return v[0] > 10 ? null : v[0] + ' is not bigger than 10.'; },
      holds: function (v) { return !isPrime(v[0]); }, show: function (v) { return isPrime(v[0]) ? v[0] + ' is prime: its only factors are 1 and ' + v[0] + '.' : v[0] + ' has more than two factors (for example ' + smallFactor(v[0]) + ').'; },
      hint: 'What kind of number has exactly two factors?', why: 'Prime numbers like 11 or 13 have exactly two factors, and there are primes bigger than 10.' },
    { text: 'If you double a whole number, the answer ends in 2, 4, 6 or 8.', vars: ['n'], truth: false,
      dom: function () { return null; },
      holds: function (v) { return (2 * v[0]) % 10 !== 0; }, show: function (v) { return '2 × ' + v[0] + ' = ' + (2 * v[0]) + '.'; },
      hint: 'Try doubling 5.', why: 'Doubles can end in 0: 2 × 5 = 10.' },
    { text: 'The sum of two whole numbers is always bigger than their product.', vars: ['a', 'b'], truth: false,
      dom: function () { return null; },
      holds: function (v) { return v[0] + v[1] > v[0] * v[1]; }, show: function (v) { return v[0] + ' + ' + v[1] + ' = ' + (v[0] + v[1]) + ' and ' + v[0] + ' × ' + v[1] + ' = ' + (v[0] * v[1]) + '.'; },
      hint: 'Try bigger numbers, like 3 and 4.', why: '3 + 4 = 7 but 3 × 4 = 12. Small examples (like 1 and 5) can fool you!' },
    // true claims
    { text: 'The sum of two even numbers is even.', vars: ['a', 'b'], truth: true,
      dom: function (v) { return even(v[0]) && even(v[1]) ? null : 'Both numbers must be even.'; },
      holds: function (v) { return even(v[0] + v[1]); }, show: function (v) { return v[0] + ' + ' + v[1] + ' = ' + (v[0] + v[1]) + ', which is ' + eo(v[0] + v[1]) + '.'; },
      why: 'Even numbers are made of pairs. Pairs + pairs is still all pairs, so the sum is always even.' },
    { text: 'The sum of an odd number and an even number is odd.', vars: ['a', 'b'], truth: true,
      dom: function (v) { return odd(v[0]) !== odd(v[1]) ? null : 'You need one odd and one even number.'; },
      holds: function (v) { return odd(v[0] + v[1]); }, show: function (v) { return v[0] + ' + ' + v[1] + ' = ' + (v[0] + v[1]) + ', which is ' + eo(v[0] + v[1]) + '.'; },
      why: 'The even number is all pairs; the odd number has one leftover dot. That one dot is still alone, so the sum is odd.' },
    { text: 'The product of two odd numbers is odd.', vars: ['a', 'b'], truth: true,
      dom: function (v) { return odd(v[0]) && odd(v[1]) ? null : 'Both numbers must be odd.'; },
      holds: function (v) { return odd(v[0] * v[1]); }, show: function (v) { return v[0] + ' × ' + v[1] + ' = ' + (v[0] * v[1]) + ', which is ' + eo(v[0] * v[1]) + '.'; },
      why: 'An odd number of odd groups: the groups pair up except one, and that group has a leftover — so one dot is always left over.' },
    { text: 'Every multiple of 8 is also a multiple of 4.', vars: ['n'], truth: true,
      dom: function (v) { return v[0] > 0 && v[0] % 8 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 8.'; },
      holds: function (v) { return v[0] % 4 === 0; }, show: function (v) { return v[0] + ' = 8 × ' + (v[0] / 8) + ' = 4 × ' + (v[0] / 4) + '.'; },
      why: '8 = 4 × 2, so 8 × k = 4 × (2 × k). Every multiple of 8 is a multiple of 4.' },
    { text: 'Every multiple of 10 ends in 0.', vars: ['n'], truth: true,
      dom: function (v) { return v[0] > 0 && v[0] % 10 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 10.'; },
      holds: function (v) { return v[0] % 10 === 0; }, show: function (v) { return v[0] + ' ends in 0.'; },
      why: 'Multiplying by 10 shifts every digit one place left and puts a 0 in the ones place.' },
    { text: 'Any whole number times an even number is even.', vars: ['a', 'even b'], truth: true,
      dom: function (v) { return even(v[1]) ? null : 'The second number must be even.'; },
      holds: function (v) { return even(v[0] * v[1]); }, show: function (v) { return v[0] + ' × ' + v[1] + ' = ' + (v[0] * v[1]) + ', which is ' + eo(v[0] * v[1]) + '.'; },
      why: 'An even number is 2 × something, so n × (2 × something) = 2 × (n × something), which is even.' },
    { text: 'The sum of three whole numbers in a row (like 4 + 5 + 6) is a multiple of 3.', vars: ['first number'], truth: true,
      dom: function () { return null; },
      holds: function (v) { return (3 * v[0] + 3) % 3 === 0; }, show: function (v) { var s = 3 * v[0] + 3; return v[0] + ' + ' + (v[0] + 1) + ' + ' + (v[0] + 2) + ' = ' + s + ' = 3 × ' + (s / 3) + '.'; },
      why: 'n + (n + 1) + (n + 2) = 3 × n + 3 = 3 × (n + 1), always a multiple of 3.' },
    { text: 'The sum of two odd numbers is even.', vars: ['a', 'b'], truth: true,
      dom: function (v) { return odd(v[0]) && odd(v[1]) ? null : 'Both numbers must be odd.'; },
      holds: function (v) { return even(v[0] + v[1]); }, show: function (v) { return v[0] + ' + ' + v[1] + ' = ' + (v[0] + v[1]) + ', which is ' + eo(v[0] + v[1]) + '.'; },
      why: 'Each odd number has one leftover dot. The two leftovers make a new pair, so the sum is even.' },
    { text: 'Every number that ends in 0 is a multiple of 5.', vars: ['n'], truth: true,
      dom: function (v) { return v[0] > 0 && v[0] % 10 === 0 ? null : v[0] + ' does not end in 0 (or is 0).'; },
      holds: function (v) { return v[0] % 5 === 0; }, show: function (v) { return v[0] + ' = 5 × ' + (v[0] / 5) + '.'; },
      why: 'A number ending in 0 is a multiple of 10, and 10 = 2 × 5.' },
    { text: 'Every multiple of 6 is even.', vars: ['n'], truth: true,
      dom: function (v) { return v[0] > 0 && v[0] % 6 === 0 ? null : v[0] + ' is not a (non-zero) multiple of 6.'; },
      holds: function (v) { return even(v[0]); }, show: function (v) { return v[0] + ' = 6 × ' + (v[0] / 6) + ', which is ' + eo(v[0]) + '.'; },
      why: '6 = 2 × 3, so 6 × k = 2 × (3 × k), which is even.' }
  ];
  function smallFactor(n) { for (var i = 2; i * i <= n; i++) if (n % i === 0) return i; return n; }

  var FALSE = CLAIMS.filter(function (c) { return !c.truth; }), TRUE = CLAIMS.filter(function (c) { return c.truth; });
  var deck = [];
  function buildDeck() { var nf = IA.rand(5, 6); deck = IA.shuffle(IA.sample(FALSE, nf).concat(IA.sample(TRUE, 10 - nf))); }

  IA.game({
    id: 'g5m-counterexample-hunter',
    title: 'Counterexample Hunter',
    emoji: '🕵️',
    back: '../index.html',
    instructions: 'Is the claim always true? If not, prove it false with ONE counterexample.',
    rounds: 10,
    delay: 2600,
    round: function (r) {
      if (r.index === 0) buildDeck();
      var c = deck[r.index];
      r.stage.appendChild(IA.el('div', { class: 'claim' }, [IA.el('div', { class: 'tag' }, ['Claim']), IA.el('div', { class: 'txt' }, [c.text])]));
      var bTrue = IA.el('button', { class: 'ia-btn', type: 'button' }, ['✅ Always true']);
      var bFalse = IA.el('button', { class: 'ia-btn', type: 'button' }, ['🔍 False — I have a counterexample']);
      r.stage.appendChild(IA.el('div', { class: 'verdicts' }, [bTrue, bFalse]));
      var hunt = IA.el('div', { class: 'hunt hidden' });
      var log = IA.el('div', { class: 'log' });
      var why = IA.el('div', { class: 'why hidden' });
      var hint = IA.el('div', { class: 'ia-hint hidden' });
      r.stage.appendChild(hunt); r.stage.appendChild(hint); r.stage.appendChild(log); r.stage.appendChild(why);
      var done = false, fitsCount = 0;

      bTrue.addEventListener('click', function () {
        if (done) return;
        bFalse.classList.remove('chosen'); bTrue.classList.add('chosen'); hunt.classList.add('hidden');
        if (c.truth) {
          done = true; why.classList.remove('hidden'); why.textContent = '✅ Always true. Why: ' + c.why;
          r.answer(true, bTrue, 'Right — it is always true!');
        } else {
          r.answer(false, bTrue, 'Not always! Hunt for a counterexample.');
          hint.classList.remove('hidden'); hint.textContent = '💡 ' + c.hint;
        }
      });

      var inputs = c.vars.map(function (v) { return IA.el('input', { class: 'ia-input', type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': v, placeholder: v }); });
      var row = IA.el('div', { class: 'inputs' });
      inputs.forEach(function (inp, i) { if (i) row.appendChild(document.createTextNode(c.vars.length === 2 ? ' and ' : '')); row.appendChild(inp); });
      var check = IA.el('button', { class: 'ia-btn primary', type: 'button' }, ['Test it 🧪']);
      row.appendChild(check);
      hunt.appendChild(IA.el('div', { class: 'ia-sub' }, [c.vars.length === 2 ? 'Type two whole numbers that break the claim.' : 'Type a whole number that breaks the claim.']));
      hunt.appendChild(row);
      inputs.forEach(function (inp) { inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') test(); }); });
      check.addEventListener('click', test);

      bFalse.addEventListener('click', function () {
        if (done) return;
        bTrue.classList.remove('chosen'); bFalse.classList.add('chosen'); hunt.classList.remove('hidden');
        setTimeout(function () { if (!('ontouchstart' in window)) inputs[0].focus(); }, 30);
      });

      function test() {
        if (done) return;
        var vals = [];
        for (var i = 0; i < inputs.length; i++) {
          var s = inputs[i].value.trim();
          if (!/^\d{1,6}$/.test(s)) { IA.toast('Type whole numbers (0, 1, 2, …)', true); inputs[i].focus(); return; }
          vals.push(parseInt(s, 10));
        }
        var reason = c.dom(vals);
        var line;
        if (reason) { line = IA.el('div', { class: 'nope' }, ['🚫 ' + reason]); log.insertBefore(line, log.firstChild); IA.sfx.bad(); return; }
        if (!c.holds(vals)) {
          done = true;
          log.insertBefore(IA.el('div', { class: 'cx' }, ['🎯 ' + c.show(vals) + ' That breaks the claim — counterexample found!']), log.firstChild);
          why.classList.remove('hidden'); why.textContent = 'The claim is false. ' + c.why;
          r.answer(true, check, 'Counterexample! 🎯');
          return;
        }
        fitsCount++;
        log.insertBefore(IA.el('div', { class: 'fits' }, ['✔ ' + c.show(vals) + ' This example fits the claim — keep hunting' + (c.truth ? ', or decide if it is always true.' : '.')]), log.firstChild);
        IA.sfx.tap();
        if (c.truth && fitsCount >= 2) {
          r.answer(false, check, 'Hmm… maybe it is always true?');
          hint.classList.remove('hidden'); hint.textContent = '💡 Every example works. Can you explain why it ALWAYS works? Then choose "Always true".';
        } else if (!c.truth && fitsCount >= 3 && c.hint) {
          hint.classList.remove('hidden'); hint.textContent = '💡 ' + c.hint;
        }
      }
    }
  });
</script>
</body>
</html>
