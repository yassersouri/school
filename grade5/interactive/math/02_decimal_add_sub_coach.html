<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Decimal Add &amp; Subtract Coach — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #00695c; --ia-accent-2: #e0f2f1; --cw: clamp(30px, 8.4vw, 50px); }
    .sum-wrap { display: flex; align-items: flex-start; justify-content: center; max-width: 100%; overflow: hidden; }
    .sign-col { width: var(--cw); display: grid; grid-template-rows: calc(var(--cw) * .6) var(--cw) var(--cw) var(--cw); }
    .sign-col div { display: flex; align-items: center; justify-content: center; font-size: calc(var(--cw) * .75); font-weight: bold; color: #00695c; }
    .sum { position: relative; width: calc(var(--cw) * 9); background-image: linear-gradient(90deg, #eef5f4 1px, transparent 1px); background-size: var(--cw) 100%; border-radius: 10px; }
    .row { display: grid; grid-template-columns: repeat(9, var(--cw)); height: var(--cw); position: relative; z-index: 1; }
    .row div { display: flex; align-items: center; justify-content: center; font-size: calc(var(--cw) * .72); font-weight: bold; font-family: 'Courier New', monospace; }
    .marks { height: calc(var(--cw) * .6); }
    .marks div { font-size: calc(var(--cw) * .42) !important; color: #c62828; }
    .marks div.pop { animation: ia-pop .45s ease; }
    .row .pt { color: #d84315; font-size: calc(var(--cw) * .9) !important; }
    .row .ghost { color: #9e9e9e; opacity: 0; transition: opacity .5s; }
    .row .ghost.show { opacity: 1; }
    .row .strike { text-decoration: line-through; text-decoration-color: #c62828; color: #999; }
    .bottom { transition: transform .2s ease; touch-action: none; cursor: grab; }
    .bottom.locked { cursor: default; }
    .bottom.locked:hover { background: none; }
    .bottom:not(.locked) { background: rgba(255, 193, 7, .18); border-radius: 10px; }
    .answer { border-top: 4px solid #37474f; }
    .answer .cell { border: 2px dashed #b0bec5; border-radius: 8px; margin: 3px; color: #00695c; }
    .answer .cell.cur { border: 3px solid #f9a825; background: #fff8e1; }
    .answer .cell.done { border-color: transparent; }
    .colhi { position: absolute; top: 0; bottom: 0; width: var(--cw); left: 0; background: #fff3c4; border-radius: 8px; transition: transform .3s ease; z-index: 0; display: none; }
    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 420px; width: 100%; }
    .keypad .ia-btn { min-height: 56px; font-size: 24px; padding: 6px; }
    .msg { font-size: 17px; text-align: center; color: #37474f; min-height: 24px; }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  function pow10(n) { var x = 1; while (n-- > 0) x *= 10; return x; }
  function fmtP(v, P) { // v = integer count of 10^-P, show exactly P decimals
    var s = String(v); while (s.length <= P) s = '0' + s;
    return P ? s.slice(0, -P) + '.' + s.slice(-P) : s;
  }
  function fmtMin(v, P) { var s = fmtP(v, P); return P ? s.replace(/0+$/, '').replace(/\.$/, '') : s; }
  function dig(X, i) { return Math.floor(X / pow10(i)) % 10; }

  var keyHandler = null;
  document.addEventListener('keydown', function (e) { if (keyHandler && /^[0-9]$/.test(e.key)) keyHandler(+e.key); });

  function genT() { var v; do { v = IA.rand(11, 199); } while (v % 10 === 0); return v; }
  function genH() { var v; do { v = IA.rand(101, 2599); } while (v % 10 === 0); return v; }

  function makeProblem(level) {
    var a, b, pa, pb, D;
    if (level === 't') { D = 1; a = genT(); b = genT(); pa = pb = 1; }
    else if (level === 'h') { D = 2; a = genH(); b = genH(); pa = pb = 2; }
    else { D = 2; if (Math.random() < .5) { a = genT() * 10; pa = 1; b = genH(); pb = 2; } else { a = genH(); pa = 2; b = genT() * 10; pb = 1; } }
    if (a === b) return makeProblem(level);
    var op = Math.random() < .5 ? '+' : '−';
    if (op === '−' && a < b) { var t = a; a = b; b = t; t = pa; pa = pb; pb = t; }
    return { a: a, b: b, pa: pa, pb: pb, D: D, op: op };
  }

  IA.game({
    id: 'g5m-decimal-add-sub-coach',
    title: 'Decimal Add & Subtract Coach',
    emoji: '🧮',
    back: '../index.html',
    instructions: 'Slide the bottom number until the decimal points line up, then fill in the answer from right to left.',
    rounds: 10,
    delay: 1600,
    levelTitle: 'Choose a level',
    levels: [
      { label: 'Tenths', value: 't', desc: '4.7 + 3.8, 9.2 − 5.6' },
      { label: 'Hundredths', value: 'h', desc: '6.35 + 2.48, 6.05 − 2.38' },
      { label: 'Mixed places', value: 'm', desc: '3.4 + 1.25, 15.3 − 7.68' }
    ],
    round: function (r) {
      keyHandler = null;
      var p = makeProblem(r.level), D = p.D;
      var A = p.a, B = p.b, R = p.op === '+' ? A + B : A - B;
      function colOf(i) { return i < D ? 4 + (D - i) : 3 - (i - D); }

      r.stage.appendChild(IA.el('div', { class: 'ia-prompt' }, [fmtMin(A, D) + ' ' + p.op + ' ' + fmtMin(B, D) + ' = ?']));
      var msg = IA.el('div', { class: 'msg' }, ['Step 1: drag the yellow row (or use ◀ ▶) so the decimal points line up.']);
      r.stage.appendChild(msg);

      function numberRow(X, places, cls) {
        var row = IA.el('div', { class: 'row ' + (cls || '') }), cells = [];
        for (var c = 0; c < 9; c++) { var d = IA.el('div'); cells.push(d); row.appendChild(d); }
        var whole = String(Math.floor(X / pow10(D)));
        for (var j = 0; j < whole.length; j++) cells[3 - j].textContent = whole[whole.length - 1 - j];
        cells[4].textContent = '.'; cells[4].className = 'pt';
        for (var k = 1; k <= D; k++) {
          cells[4 + k].textContent = String(dig(X, D - k));
          if (k > places) cells[4 + k].className = 'ghost';
        }
        return { row: row, cells: cells };
      }
      var marks = IA.el('div', { class: 'row marks' }), markCells = [];
      for (var c = 0; c < 9; c++) { var m = IA.el('div'); markCells.push(m); marks.appendChild(m); }
      var top = numberRow(A, p.pa), bot = numberRow(B, p.pb, 'bottom');
      var ans = IA.el('div', { class: 'row answer' }), ansCells = [];
      for (c = 0; c < 9; c++) { var a = IA.el('div'); ansCells.push(a); ans.appendChild(a); }
      var colhi = IA.el('div', { class: 'colhi' });
      var sum = IA.el('div', { class: 'sum' }, [colhi, marks, top.row, bot.row, ans]);
      var signCol = IA.el('div', { class: 'sign-col', 'aria-hidden': 'true' }, [IA.el('div'), IA.el('div'), IA.el('div', {}, [p.op]), IA.el('div')]);
      r.stage.appendChild(IA.el('div', { class: 'sum-wrap' }, [signCol, sum]));

      // Step 1: alignment
      var off;
      if (r.level === 'm') off = p.pa - p.pb; else off = IA.pick([-2, -1, 1, 2]);
      if (off === 0) off = 1;
      function setOff(o) { off = Math.max(-2, Math.min(2, o)); bot.row.style.transform = 'translateX(calc(' + off + ' * var(--cw)))'; }
      setOff(off);
      var dragging = false, x0 = 0, o0 = 0;
      bot.row.addEventListener('pointerdown', function (e) { if (bot.row.classList.contains('locked')) return; dragging = true; x0 = e.clientX; o0 = off; try { bot.row.setPointerCapture(e.pointerId); } catch (er) {} });
      bot.row.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var cw = top.cells[0].getBoundingClientRect().width || 40;
        var n = o0 + Math.round((e.clientX - x0) / cw);
        if (n !== off) { IA.sfx.tap(); setOff(n); }
      });
      bot.row.addEventListener('pointerup', function () { dragging = false; });
      bot.row.addEventListener('pointercancel', function () { dragging = false; });
      var check = IA.el('button', { class: 'ia-btn primary', type: 'button' }, ['Points lined up ✔']);
      var ctrls = IA.el('div', { class: 'ia-row' }, [
        IA.el('button', { class: 'ia-btn', type: 'button', 'aria-label': 'Slide left', onclick: function () { IA.sfx.tap(); setOff(off - 1); } }, ['◀']),
        IA.el('button', { class: 'ia-btn', type: 'button', 'aria-label': 'Slide right', onclick: function () { IA.sfx.tap(); setOff(off + 1); } }, ['▶']),
        check]);
      r.stage.appendChild(ctrls);
      var hint = IA.el('div', { class: 'ia-hint', style: { display: 'none' } });
      check.addEventListener('click', function () {
        if (off !== 0) {
          r.answer(false, check, 'The points are not lined up yet!');
          hint.style.display = ''; hint.textContent = 'Line up the decimal points (the orange dots), not the last digits. Ones go under ones, tenths under tenths.';
          return;
        }
        IA.sfx.good(); IA.toast('Points lined up! 👍');
        bot.row.classList.add('locked');
        hint.style.display = 'none';
        r.stage.removeChild(ctrls);
        var ghosts = sum.querySelectorAll('.ghost');
        Array.prototype.forEach.call(ghosts, function (g) { g.classList.add('show'); });
        msg.textContent = (ghosts.length ? 'An empty place is a 0 (grey). ' : '') + 'Step 2: ' + (p.op === '+' ? 'add' : 'subtract') + ' each column, starting on the right.';
        startColumns();
      });
      r.stage.appendChild(hint);

      // Step 2: column-by-column
      function startColumns() {
        var nR = D + String(Math.floor(R / pow10(D))).length;
        ansCells[4].textContent = '.'; ansCells[4].className = 'pt';
        for (var i = 0; i < nR; i++) ansCells[colOf(i)].className = 'cell';
        var t = []; for (i = 0; i < 6; i++) t.push(dig(A, i));
        var carry = 0, cur = 0, steps = [];
        function prepare(i) {
          var c = colOf(i), b = dig(B, i), st = { i: i };
          if (p.op === '+') {
            var s = dig(A, i) + b + carry;
            st.digit = s % 10; st.carry = s >= 10 ? 1 : 0;
            st.expl = dig(A, i) + ' + ' + b + (carry ? ' + 1 (carried)' : '') + ' = ' + s + (s >= 10 ? ' → write ' + (s % 10) + ', carry 1 to the next column on the left.' : ' → write ' + s + '.');
          } else {
            var orig = t[i], note = '';
            if (t[i] < b) {
              var j = i + 1; while (t[j] === 0) j++;
              t[j]--; setMark(j, t[j]);
              for (var k = j - 1; k > i; k--) { t[k] = 9; setMark(k, 9); }
              t[i] += 10; setMark(i, t[i]);
              note = orig + ' is less than ' + b + ', so we traded 1 from the left: ';
            }
            st.digit = t[i] - b;
            st.expl = note + t[i] + ' − ' + b + ' = ' + st.digit + '.';
          }
          colhi.style.display = 'block';
          colhi.style.transform = 'translateX(calc(' + c + ' * var(--cw)))';
          Array.prototype.forEach.call(ans.querySelectorAll('.cur'), function (x) { x.classList.remove('cur'); });
          ansCells[c].classList.add('cur');
          return st;
        }
        function setCarry(c) {
          markCells[c].textContent = '1';
          markCells[c].classList.remove('pop'); void markCells[c].offsetWidth; markCells[c].classList.add('pop');
        }
        function setMark(i, v) {
          var c = colOf(i);
          top.cells[c].classList.add('strike');
          markCells[c].textContent = String(v);
          markCells[c].classList.remove('pop'); void markCells[c].offsetWidth; markCells[c].classList.add('pop');
        }
        var step = prepare(0);
        var keypad = IA.el('div', { class: 'keypad' });
        for (var d = 1; d <= 10; d++) (function (n) {
          keypad.appendChild(IA.el('button', { class: 'ia-btn', type: 'button', onclick: function () { press(n); } }, [String(n)]));
        })(d % 10);
        r.stage.insertBefore(keypad, hint);
        keyHandler = press;
        function press(n) {
          if (!step) return;
          var c = colOf(step.i);
          if (n !== step.digit) {
            r.answer(false, ansCells[c], 'Check that column again!');
            hint.style.display = ''; hint.textContent = step.expl;
            return;
          }
          IA.sfx.tap();
          hint.style.display = 'none';
          ansCells[c].textContent = String(n); ansCells[c].classList.remove('cur'); ansCells[c].classList.add('done');
          if (p.op === '+') { carry = step.carry; if (carry) setCarry(colOf(step.i + 1)); }
          cur++;
          if (cur < nR) { step = prepare(cur); return; }
          step = null; keyHandler = null; colhi.style.display = 'none';
          keypad.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          msg.textContent = fmtMin(A, D) + ' ' + p.op + ' ' + fmtMin(B, D) + ' = ' + fmtMin(R, D);
          r.answer(true, msg, '= ' + fmtMin(R, D) + ' ✔');
        }
      }
    }
  });
</script>
</body>
</html>
