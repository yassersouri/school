<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Number Line Hopper — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #2e7d32; --ia-accent-2: #e8f5e9; --w: min(11.5vw, 78px); }
    .nl { position: relative; padding-top: 58px; }
    .cells { display: flex; position: relative; z-index: 1; }
    .cell { width: var(--w); display: flex; flex-direction: column; align-items: center; }
    .num { width: calc(var(--w) - 8px); height: calc(var(--w) - 8px); max-height: 60px; min-height: 40px; border-radius: 12px; background: #fff; border: 3px solid #a5d6a7; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: clamp(15px, 3.6vw, 26px); color: #1b5e20; }
    .num.blank { border-style: dashed; border-color: #bbb; color: #999; background: #fafafa; }
    .num.active { border-color: #f0c040; background: #fff8dc; box-shadow: 0 0 0 4px #ffe58f; color: #8a6d00; }
    .num.filled { border-style: solid; border-color: var(--ia-accent); background: #e8f5e9; }
    .tick { width: 3px; height: 14px; background: #555; }
    .axis { position: absolute; left: 0; right: 0; bottom: 34px; height: 4px; background: #555; border-radius: 2px; }
    .jumps { display: flex; padding-left: calc(var(--w) / 2); height: 30px; margin-top: 4px; }
    .jump { width: var(--w); text-align: center; font-weight: bold; font-size: clamp(13px, 3vw, 18px); color: #e65100; opacity: 0; transition: opacity .3s; }
    .jumps.show .jump { opacity: 1; }
    .jumps.show .jump::before { content: '⤻ '; }
    .frog { position: absolute; top: 4px; left: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1; z-index: 2; pointer-events: none; }
    .mode { font-size: 16px; color: #555; }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  var LEN = 7;
  function makeSeq(lv) {
    var step = lv.step, start;
    if (lv.mode === 'back1') { start = IA.rand(LEN, 100); return seqFrom(start, -1); }
    if (step === 1) start = IA.rand(0, 100 - (LEN - 1));
    else if (step === 2) start = 2 * IA.rand(0, (100 - 2 * (LEN - 1)) / 2);
    else if (step === 5) start = 5 * IA.rand(0, (100 - 5 * (LEN - 1)) / 5);
    else start = 10 * IA.rand(0, (100 - 10 * (LEN - 1)) / 10);
    return seqFrom(start, step);
  }
  function seqFrom(s, step) { var a = []; for (var i = 0; i < LEN; i++) a.push(s + i * step); return a; }
  function choicesFor(ans, step) {
    var st = Math.abs(step);
    var cands = IA.shuffle([ans + st, ans - st, ans + 1, ans - 1, ans + 2 * st, ans - 2 * st, ans + 10, ans - 10]);
    var out = [ans], seen = {}; seen[ans] = 1;
    cands.forEach(function (c) { if (out.length < 4 && c >= 0 && c <= 100 && !seen[c]) { seen[c] = 1; out.push(c); } });
    return IA.shuffle(out);
  }

  IA.game({
    id: 'g1m-number-line-hopper',
    title: 'Number Line Hopper',
    emoji: '🐸',
    back: '../index.html',
    instructions: 'Help the frog! Find the missing number on the number line.',
    rounds: 10,
    delay: 2300,
    levelTitle: 'How does the frog hop?',
    levels: [
      { label: 'Forward by 1s', value: { step: 1, mode: 'fwd1', say: 'Count forward by ones.' }, desc: '23, 24, 25 …' },
      { label: 'Backward by 1s', value: { step: -1, mode: 'back1', say: 'Count backward by ones.' }, desc: '45, 44, 43 …' },
      { label: 'Skip by 2s', value: { step: 2, say: 'Skip count by twos.' }, desc: '10, 12, 14 …' },
      { label: 'Skip by 5s', value: { step: 5, say: 'Skip count by fives.' }, desc: '25, 30, 35 …' },
      { label: 'Skip by 10s', value: { step: 10, say: 'Skip count by tens.' }, desc: '20, 30, 40 … to 100' }
    ],
    round: function (r) {
      var lv = r.level, step = lv.step;
      var seq = makeSeq(lv);
      var nMissing = r.index >= 4 && Math.random() < 0.6 ? 2 : 1;
      var missing = IA.sample([2, 3, 4, 5, 6], nMissing).sort(function (a, b) { return a - b; });
      var k = 0;

      r.stage.appendChild(IA.el('div', { class: 'ia-row mode' }, [lv.say + ' What number is missing?', IA.speakButton(function () { return lv.say + ' What number is missing?'; })]));

      var nl = IA.el('div', { class: 'nl' });
      var cellsRow = IA.el('div', { class: 'cells' });
      var boxes = seq.map(function (v, i) {
        var isBlank = missing.indexOf(i) >= 0;
        var box = IA.el('div', { class: 'num' + (isBlank ? ' blank' : '') }, [isBlank ? '?' : String(v)]);
        cellsRow.appendChild(IA.el('div', { class: 'cell' }, [box, IA.el('div', { class: 'tick' })]));
        return box;
      });
      var jumps = IA.el('div', { class: 'jumps' });
      for (var j = 0; j < LEN - 1; j++) jumps.appendChild(IA.el('div', { class: 'jump' }, [(step > 0 ? '+' : '−') + Math.abs(step)]));
      var frog = IA.el('div', { class: 'frog', 'aria-hidden': 'true' }, ['🐸']);
      nl.appendChild(IA.el('div', { class: 'axis' }));
      nl.appendChild(cellsRow); nl.appendChild(jumps); nl.appendChild(frog);
      r.stage.appendChild(nl);

      function xOf(i) { var c = cellsRow.children[i]; return c.offsetLeft + c.offsetWidth / 2 - frog.offsetWidth / 2; }
      requestAnimationFrame(function () { frog.style.transform = 'translate(' + xOf(0) + 'px,0)'; });

      function hopAll() {
        var i = 0;
        IA.say(seq.join(', '), { rate: 1.05 });
        (function hop() {
          if (i >= LEN - 1 || !frog.isConnected) return;
          var a = xOf(i), b = xOf(i + 1);
          var anim = frog.animate ? frog.animate([
            { transform: 'translate(' + a + 'px,0)' },
            { transform: 'translate(' + (a + b) / 2 + 'px,-34px)' },
            { transform: 'translate(' + b + 'px,0)' }
          ], { duration: 240, easing: 'ease-in-out', fill: 'forwards' }) : null;
          frog.style.transform = 'translate(' + b + 'px,0)';
          i++;
          if (anim) anim.onfinish = hop; else setTimeout(hop, 240);
        })();
      }

      var area = IA.el('div', { style: { width: '100%', display: 'flex', justifyContent: 'center' } });
      r.stage.appendChild(area);

      function ask() {
        boxes.forEach(function (b) { b.classList.remove('active'); });
        var idx = missing[k];
        boxes[idx].classList.add('active');
        IA.clear(area);
        var ans = seq[idx], done = false;
        var proxy = {
          answer: function (ok, el) {
            if (done) return false;
            if (!ok) { jumps.classList.add('show'); return r.answer(false, el, 'Look at the jumps: ' + (step > 0 ? '+' : '−') + Math.abs(step) + ' each time!'); }
            done = true;
            boxes[idx].textContent = String(ans);
            boxes[idx].classList.remove('blank', 'active'); boxes[idx].classList.add('filled');
            k++;
            if (k < missing.length) { IA.sfx.good(); el.classList.add('ia-correct'); setTimeout(ask, 450); return true; }
            hopAll();
            return r.answer(true, el);
          }
        };
        IA.choices(proxy, area, choicesFor(ans, step), ans, { speak: true });
      }
      ask();
    }
  });
</script>
</body>
</html>
