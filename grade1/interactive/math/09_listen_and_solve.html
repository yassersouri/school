<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Listen &amp; Solve — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #2e7d32; --ia-accent-2: #e8f5e9; }
    .story { display: flex; align-items: flex-start; gap: 12px; max-width: 680px; font-size: clamp(19px, 3.8vw, 25px); line-height: 1.45; background: #f6fbf4; border: 3px solid #c8e6c9; border-radius: 18px; padding: 12px 16px; }
    .story p { margin: 0; flex: 1; }
    .pics { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .grp { display: grid; grid-template-columns: repeat(5, auto); gap: 2px 4px; padding: 6px 8px; border: 2px dashed #c8e6c9; border-radius: 12px; background: #fff; }
    .grp span { font-size: clamp(22px, 4.6vw, 32px); line-height: 1.15; position: relative; }
    .grp span.x { opacity: .35; }
    .grp span.x::after { content: '✖'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #c62828; font-size: .8em; opacity: 1; }
    .op { font-size: clamp(26px, 5vw, 36px); font-weight: bold; color: #555; }
    @media (max-width: 520px) { .prow { flex-direction: column; gap: 4px; } }
    .q { font-size: clamp(26px, 5vw, 36px); }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  var NAMES = [['Maya', 'she'], ['Liam', 'he'], ['Ava', 'she'], ['Noah', 'he'], ['Zara', 'she'], ['Arjun', 'he'], ['Chloe', 'she'],
    ['Ethan', 'he'], ['Priya', 'she'], ['Owen', 'he'], ['Sofia', 'she'], ['Lucas', 'he'], ['Amira', 'she'], ['Kai', 'he'], ['Mei', 'she'], ['Omar', 'he']];
  function O(e, s, p) { return { e: e, s: s, p: p }; }
  var THINGS = [O('🍎', 'apple', 'apples'), O('⚽', 'ball', 'balls'), O('🖍️', 'crayon', 'crayons'), O('🐚', 'shell', 'shells'),
    O('⭐', 'sticker', 'stickers'), O('🚗', 'toy car', 'toy cars'), O('🎈', 'balloon', 'balloons'), O('🍓', 'strawberry', 'strawberries'),
    O('🧸', 'teddy bear', 'teddy bears'), O('🌸', 'flower', 'flowers'), O('🥕', 'carrot', 'carrots'), O('🍪', 'cookie', 'cookies')];
  var FLY = [O('🐦', 'bird', 'birds'), O('🦋', 'butterfly', 'butterflies'), O('🐝', 'bee', 'bees')];
  var POND = [O('🦆', 'duck', 'ducks'), O('🐸', 'frog', 'frogs')];
  var PICK = [O('🍎', 'apple', 'apples'), O('🍓', 'strawberry', 'strawberries'), O('🌸', 'flower', 'flowers'), O('🥕', 'carrot', 'carrots')];
  var COLOUR = [O('🎈', 'balloon', 'balloons'), O('🖍️', 'crayon', 'crayons'), O('🚗', 'toy car', 'toy cars'), O('⚽', 'ball', 'balls')];
  var SMALL = [O('🐚', 'shell', 'shells'), O('🌰', 'acorn', 'acorns'), O('🍓', 'strawberry', 'strawberries')];
  var FISH = [O('🐟', 'fish', 'fish')], BOOK = [O('📕', 'book', 'books')], CAR = [O('🚗', 'car', 'cars')], COOKIE = [O('🍪', 'cookie', 'cookies')],
    KID = [O('🧒', 'child', 'children')], BALLOON = [O('🎈', 'balloon', 'balloons')], FROG = [O('🐸', 'frog', 'frogs')], DUCK = [O('🦆', 'duck', 'ducks')],
    STICKER = [O('⭐', 'sticker', 'stickers')], APPLE = [O('🍎', 'apple', 'apples')], BIRD = [O('🐦', 'bird', 'birds')];
  var CAT = O('🐱', 'cat', 'cats'), DOG = O('🐶', 'dog', 'dogs');

  function pl(o, n) { return n + ' ' + (n === 1 ? o.s : o.p); }
  function be(n) { return n === 1 ? 'is' : 'are'; }
  function v(n, one, many) { return n === 1 ? one : many; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Each template: type (add/sub/cmp/miss/part/dbl), objs pool, text(x) where x = {N, P, p, N2, o, a, b, c}
  var T = [
    { type: 'add', objs: THINGS, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.P + ' gets ' + x.b + ' more. How many ' + x.o.p + ' does ' + x.N + ' have now?'; } },
    { type: 'add', objs: FLY, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' in a tree. ' + x.b + ' more ' + v(x.b, x.o.s, x.o.p) + ' ' + v(x.b, 'flies', 'fly') + ' in. How many ' + x.o.p + ' are in the tree now?'; } },
    { type: 'add', objs: PICK, text: function (x) { return x.N + ' picked ' + pl(x.o, x.a) + '. ' + x.N2 + ' picked ' + pl(x.o, x.b) + '. How many ' + x.o.p + ' did they pick in all?'; } },
    { type: 'add', objs: POND, text: function (x) { return cap(pl(x.o, x.a)) + ' ' + be(x.a) + ' swimming in the pond. ' + x.b + ' more ' + v(x.b, x.o.s, x.o.p) + ' ' + v(x.b, 'jumps', 'jump') + ' in. How many ' + x.o.p + ' are in the pond now?'; } },
    { type: 'add', objs: COLOUR, text: function (x) { return x.N + ' has ' + x.a + ' red ' + v(x.a, x.o.s, x.o.p) + ' and ' + x.b + ' blue ' + v(x.b, x.o.s, x.o.p) + '. How many ' + x.o.p + ' does ' + x.p + ' have in all?'; } },
    { type: 'add', objs: FISH, text: function (x) { return 'There ' + be(x.a) + ' ' + x.a + ' fish in a tank. Dad adds ' + x.b + ' more fish. How many fish are in the tank now?'; } },
    { type: 'add', objs: BOOK, text: function (x) { return x.N + ' read ' + pl(x.o, x.a) + ' on Monday and ' + pl(x.o, x.b) + ' on Tuesday. How many books did ' + x.p + ' read in all?'; } },
    { type: 'add', objs: CAR, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' in the parking lot. ' + x.b + ' more ' + v(x.b, 'car drives', 'cars drive') + ' in. How many cars are in the parking lot now?'; } },
    { type: 'add', objs: COOKIE, text: function (x) { return x.N + ' baked ' + pl(x.o, x.a) + '. ' + x.N2 + ' baked ' + pl(x.o, x.b) + '. How many cookies did they bake altogether?'; } },
    { type: 'add', objs: KID, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' on the slide and ' + pl(x.o, x.b) + ' on the swings. How many children are playing?'; } },
    { type: 'dbl', objs: SMALL, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + ' in each hand. How many ' + x.o.p + ' does ' + x.p + ' have in all?'; } },
    { type: 'sub', objs: THINGS, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.P + ' gives ' + x.b + ' to a friend. How many ' + x.o.p + ' does ' + x.N + ' have left?'; } },
    { type: 'sub', objs: FLY, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' on a fence. ' + x.b + ' ' + v(x.b, 'flies', 'fly') + ' away. How many ' + x.o.p + ' are still on the fence?'; } },
    { type: 'sub', objs: BALLOON, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.b + ' ' + v(x.b, 'pops', 'pop') + '! How many balloons does ' + x.p + ' have left?'; } },
    { type: 'sub', objs: COOKIE, text: function (x) { return x.N + ' had ' + pl(x.o, x.a) + '. ' + x.P + ' ate ' + x.b + '. How many cookies are left?'; } },
    { type: 'sub', objs: FROG, text: function (x) { return cap(pl(x.o, x.a)) + ' ' + be(x.a) + ' sitting on a log. ' + x.b + ' ' + v(x.b, 'hops', 'hop') + ' into the water. How many frogs are still on the log?'; } },
    { type: 'sub', objs: DUCK, text: function (x) { return cap(pl(x.o, x.a)) + ' ' + be(x.a) + ' swimming in the pond. ' + x.b + ' ' + v(x.b, 'swims', 'swim') + ' away. How many ducks are still in the pond?'; } },
    { type: 'sub', objs: STICKER, text: function (x) { return x.N + ' had ' + pl(x.o, x.a) + '. ' + x.P + ' used ' + x.b + ' on a card. How many stickers does ' + x.p + ' have left?'; } },
    { type: 'sub', objs: KID, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' on the bus. At the next stop, ' + x.b + ' ' + v(x.b, 'gets', 'get') + ' off. How many children are still on the bus?'; } },
    { type: 'sub', objs: APPLE, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' on a tree. ' + x.b + ' ' + v(x.b, 'falls', 'fall') + ' to the ground. How many apples are still on the tree?'; } },
    { type: 'cmp', objs: THINGS, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.N2 + ' has ' + pl(x.o, x.b) + '. How many more ' + x.o.p + ' does ' + x.N + ' have than ' + x.N2 + '?'; } },
    { type: 'cmp', objs: [CAT], o2: DOG, text: function (x) { return 'At the animal shelter there ' + be(x.a) + ' ' + pl(CAT, x.a) + ' and ' + pl(DOG, x.b) + '. How many more cats than dogs are there?'; } },
    { type: 'cmp', objs: THINGS, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.N2 + ' has ' + pl(x.o, x.b) + '. How many fewer ' + x.o.p + ' does ' + x.N2 + ' have?'; } },
    { type: 'miss', objs: THINGS, text: function (x) { return x.N + ' has ' + pl(x.o, x.a) + '. ' + x.P + ' gets some more. Now ' + x.p + ' has ' + pl(x.o, x.c) + '. How many ' + x.o.p + ' did ' + x.N + ' get?'; } },
    { type: 'miss', objs: BIRD, text: function (x) { return 'There ' + be(x.a) + ' ' + pl(x.o, x.a) + ' at the bird feeder. Some more fly in. Now there are ' + pl(x.o, x.c) + '. How many birds flew in?'; } },
    { type: 'part', objs: COLOUR, text: function (x) { return x.N + ' has ' + pl(x.o, x.c) + '. ' + x.a + ' ' + be(x.a) + ' red and the rest are blue. How many ' + x.o.p + ' are blue?'; } },
    { type: 'part', objs: APPLE, text: function (x) { return 'There are ' + pl(x.o, x.c) + ' in a basket. ' + x.a + ' ' + be(x.a) + ' red. The rest are green. How many green apples are there?'; } }
  ];

  function numbers(type, max) {
    var big = max > 10, a, b, c, s;
    if (type === 'add') { s = big ? IA.rand(11, 20) : IA.rand(3, 10); a = IA.rand(Math.max(1, s - 10), Math.min(10, s - 1)); return { a: a, b: s - a, ans: s }; }
    if (type === 'dbl') { a = big ? IA.rand(6, 10) : IA.rand(1, 5); return { a: a, b: a, ans: 2 * a }; }
    if (type === 'sub') { a = big ? IA.rand(11, 20) : IA.rand(3, 10); b = IA.rand(1, Math.min(a - 1, big ? 10 : 9)); return { a: a, b: b, ans: a - b }; }
    if (type === 'cmp') { a = big ? IA.rand(10, 20) : IA.rand(3, 10); b = IA.rand(Math.max(1, a - (big ? 9 : 6)), a - 1); return { a: a, b: b, ans: a - b }; }
    c = big ? IA.rand(11, 20) : IA.rand(3, 10); a = IA.rand(Math.max(1, c - 9), c - 1);
    return { a: a, c: c, ans: c - a };
  }
  function grp(n, e, cross) {
    var g = IA.el('div', { class: 'grp', 'aria-hidden': 'true' });
    for (var i = 0; i < n; i++) g.appendChild(IA.el('span', { class: cross && i >= n - cross ? 'x' : '' }, [e]));
    return g;
  }
  function op(t) { return IA.el('span', { class: 'op' }, [t]); }

  var lastT = [];
  IA.game({
    id: 'g1m-listen-solve',
    title: 'Listen & Solve',
    emoji: '👂',
    back: '../index.html',
    instructions: 'Listen to the story, look at the pictures, then pick the answer.',
    rounds: 10,
    levelTitle: 'How big are the numbers?',
    levels: [
      { label: 'Within 10', value: { max: 10 }, desc: 'Numbers up to 10' },
      { label: 'Within 20', value: { max: 20 }, desc: 'Numbers up to 20' }
    ],
    round: function (r) {
      var t; do { t = IA.pick(T); } while (lastT.indexOf(t) >= 0);
      lastT.push(t); if (lastT.length > 6) lastT.shift();
      var nm = IA.pick(NAMES), nm2; do { nm2 = IA.pick(NAMES); } while (nm2 === nm);
      var o = IA.pick(t.objs);
      var n = numbers(t.type, r.level.max);
      var x = { N: nm[0], P: cap(nm[1]), p: nm[1], N2: nm2[0], o: o, a: n.a, b: n.b, c: n.c };
      var text = t.text(x);

      r.stage.appendChild(IA.el('div', { class: 'story' }, [IA.el('p', {}, [text]), IA.speakButton(text)]));
      setTimeout(function () { IA.say(text, { rate: 0.85 }); }, 150);

      var pics = IA.el('div', { class: 'pics' }), row = IA.el('div', { class: 'prow' }), sentence;
      if (t.type === 'add' || t.type === 'dbl') { row.appendChild(grp(n.a, o.e)); row.appendChild(op('+')); row.appendChild(grp(n.b, o.e)); sentence = n.a + ' + ' + n.b + ' = ?'; }
      else if (t.type === 'sub') { row.appendChild(grp(n.a, o.e, n.b)); sentence = n.a + ' − ' + n.b + ' = ?'; }
      else if (t.type === 'cmp') {
        row.appendChild(grp(n.a, o.e)); pics.appendChild(row);
        row = IA.el('div', { class: 'prow' }, [grp(n.b, (t.o2 || o).e)]);
        sentence = n.a + ' − ' + n.b + ' = ?  (match them up and count the extras)';
      } else { row.appendChild(grp(n.a, o.e)); row.appendChild(op('+')); row.appendChild(IA.el('span', { class: 'q' }, ['❓'])); row.appendChild(op('= ' + n.c)); sentence = n.a + ' + ? = ' + n.c + '  →  ' + n.c + ' − ' + n.a + ' = ?'; }
      pics.appendChild(row);
      r.stage.appendChild(pics);

      var hint = IA.el('div', { class: 'ia-hint', style: { display: 'none' } }, ['💡 ' + sentence]);
      r.stage.appendChild(hint);
      var proxy = { answer: function (ok, el) { if (!ok) hint.style.display = ''; return r.answer(ok, el); } };
      IA.choices(proxy, r.stage, IA.numberChoices(n.ans, 4, 3, 0), n.ans, { speak: true });
    }
  });
</script>
</body>
</html>
