<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sight Word Flash Cards — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #1a6fbd; --ia-accent-2: #e3f0fb; }
    .sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: 100%; }
    .sets .ia-btn { flex-direction: column; min-height: 120px; }
    .sets small { font-size: 13px; font-weight: normal; color: #777; }
    .meter { width: 100%; height: 8px; background: #eee6d6; border-radius: 999px; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 100%; background: var(--ia-good); transform-origin: left; }
    .card { width: min(420px, 100%); min-height: 220px; background: #fff; border: 4px solid var(--ia-accent); border-radius: 26px; box-shadow: 0 8px 0 #cfe3f7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; position: relative; }
    .card.flip { animation: flipin .35s ease; }
    @keyframes flipin { from { transform: rotateY(80deg); opacity: .2; } to { transform: rotateY(0); opacity: 1; } }
    .card .word { font-size: clamp(56px, 13vw, 96px); font-weight: bold; color: #222; line-height: 1.1; }
    .card .badge { position: absolute; top: 10px; right: 14px; font-size: 13px; color: #888; }
    .card .count { position: absolute; top: 10px; left: 14px; font-size: 13px; color: #888; }
    .answers { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .answers .ia-btn { flex: 1; min-width: 180px; max-width: 260px; min-height: 72px; }
    .know { background: #e8f5e9; border-color: #66bb6a; box-shadow: 0 4px 0 #66bb6a; }
    .again { background: #fff3e0; border-color: #ffb74d; box-shadow: 0 4px 0 #ffb74d; }
    .practise-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .practise-list span { background: #fff3e0; border: 2px solid #ffb74d; border-radius: 10px; padding: 4px 10px; font-size: 22px; font-weight: bold; }
    @media (prefers-reduced-motion: reduce) { .card.flip { animation: none; } }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  // Word lists match grade1/reading/12_sight_words (Sets 1–3).
  var SETS = [
    { name: 'Set 1', emoji: '🌱', words: ['the', 'a', 'I', 'is', 'it', 'to', 'see', 'my', 'like', 'go', 'can', 'we', 'am', 'in', 'on', 'and', 'at', 'he', 'she', 'no', 'yes', 'up', 'look', 'you', 'me', 'do', 'said', 'was', 'of', 'for'] },
    { name: 'Set 2', emoji: '🌿', words: ['are', 'they', 'have', 'what', 'when', 'with', 'this', 'that', 'then', 'them', 'their', 'here', 'there', 'where', 'who', 'why', 'how', 'some', 'come', 'want', 'will', 'your', 'very', 'again', 'into', 'our', 'out', 'about', 'made', 'make'] },
    { name: 'Set 3', emoji: '🌳', words: ['because', 'before', 'after', 'around', 'another', 'every', 'never', 'only', 'other', 'over', 'under', 'please', 'thank', 'friend', 'family', 'people', 'school', 'water', 'today', 'tomorrow', 'yesterday', 'morning', 'night', 'little', 'big', 'new', 'old', 'first', 'last', 'next'] }
  ];
  var PKEY = 'g1r-sight-progress';
  function progress() { return IA.load(PKEY, {}) || {}; }
  function record(word, known) {
    var p = progress(), e = p[word] || { k: 0, p: 0 };
    if (known) e.k++; else e.p++;
    e.last = known ? 'k' : 'p';
    p[word] = e; IA.save(PKEY, p);
  }
  function mastered(words) { var p = progress(); return words.filter(function (w) { return p[w] && p[w].last === 'k'; }).length; }

  var shell = IA.freePlay({
    id: 'g1r-sight-word-flash',
    title: 'Sight Word Flash Cards',
    emoji: '⚡',
    back: '../index.html',
    instructions: 'Read the word. Do you know it? Tap 🔊 to check.'
  });
  var stage = shell.stage;

  function picker() {
    IA.stopSpeech();
    IA.clear(stage); shell.setProgress(0); shell.setScore('');
    stage.appendChild(IA.el('div', { class: 'ia-prompt' }, ['Pick a set of words']));
    var grid = IA.el('div', { class: 'sets' });
    SETS.forEach(function (s) {
      var m = mastered(s.words), meter = IA.el('i', { style: { transform: 'scaleX(' + (m / s.words.length) + ')' } });
      grid.appendChild(IA.el('button', { class: 'ia-btn', type: 'button', onclick: function () { IA.sfx.tap(); play(s); } }, [
        IA.el('strong', {}, [s.emoji + ' ' + s.name]),
        IA.el('small', {}, [s.words.slice(0, 5).join(', ') + ' …']),
        IA.el('div', { class: 'meter', 'aria-hidden': 'true' }, [meter]),
        IA.el('small', {}, ['✅ ' + m + ' of ' + s.words.length + ' known'])
      ]));
    });
    stage.appendChild(grid);
  }

  function play(set) {
    var total = set.words.length, deck = IA.shuffle(set.words), missed = {}, known = 0;
    function update() { shell.setProgress(known / total); shell.setScore('✅ ' + known + ' / ' + total); }
    function show() {
      IA.clear(stage); update();
      if (!deck.length) return finish();
      var word = deck[0], p = progress()[word];
      var card = IA.el('div', { class: 'card flip' }, [
        IA.el('div', { class: 'count' }, [deck.length + ' card' + (deck.length === 1 ? '' : 's') + ' left']),
        p && p.k ? IA.el('div', { class: 'badge' }, ['⭐ known ' + p.k + '×']) : null,
        IA.el('div', { class: 'word' }, [word]),
        IA.speakButton(word)
      ]);
      card.querySelector('.ia-speak').classList.add('big');
      stage.appendChild(card);
      stage.appendChild(IA.el('div', { class: 'answers' }, [
        IA.el('button', { class: 'ia-btn know', type: 'button', onclick: function () {
          deck.shift(); known++; record(word, true); IA.sfx.good();
          IA.toast(IA.pick(['Yes! ⭐', 'You know it! 🙌', 'Great reading! 🌟']));
          show();
        } }, ['I know it ✅']),
        IA.el('button', { class: 'ia-btn again', type: 'button', onclick: function () {
          deck.shift(); missed[word] = true; record(word, false);
          deck.splice(Math.min(3, deck.length), 0, word);
          IA.say(word, { rate: 0.75 });
          IA.toast('This word is ' + word + '. It will come back soon! 🔁');
          show();
        } }, ['Practise again 🔁'])
      ]));
      stage.appendChild(IA.el('button', { class: 'ia-btn small', type: 'button', onclick: picker }, ['🗂️ Change set']));
    }
    function finish() {
      var miss = Object.keys(missed), first = total - miss.length, pct = first / total;
      var stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1;
      shell.setProgress(1); shell.done(stars);
      IA.sfx.win(); IA.confetti();
      IA.say('You finished ' + set.name + '!');
      IA.clear(stage);
      stage.appendChild(IA.el('div', { class: 'ia-finish' }, [
        IA.el('div', { class: 'ia-big-stars' }, ['⭐'.repeat(stars) + '☆'.repeat(3 - stars)]),
        IA.el('h2', {}, ['You knew ' + first + ' of ' + total + ' words the first time!']),
        miss.length ? IA.el('div', { class: 'ia-sub' }, ['Words to keep practising:']) : null,
        miss.length ? IA.el('div', { class: 'practise-list' }, miss.map(function (w) {
          return IA.el('span', {}, [w, ' ', IA.speakButton(w)]);
        })) : null,
        IA.el('div', { class: 'ia-row' }, [
          IA.el('button', { class: 'ia-btn primary', type: 'button', onclick: function () { play(set); } }, ['🔁 Play again']),
          IA.el('button', { class: 'ia-btn', type: 'button', onclick: picker }, ['🗂️ Another set']),
          IA.el('a', { class: 'ia-btn', href: '../index.html' }, ['🏠 More activities'])
        ])
      ]));
    }
    show();
  }
  picker();
</script>
</body>
</html>
