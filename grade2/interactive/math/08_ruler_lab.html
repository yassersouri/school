<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruler Lab — Interactive</title>
  <link rel="stylesheet" href="../../../assets/interactive/interactive.css">
  <style>
    :root { --ia-accent: #5e35b1; --ia-accent-2: #ede7f6; }
    .rwrap { width: 100%; max-width: 820px; }
    .rwrap svg { width: 100%; height: auto; display: block; }
    .ruler { transition: opacity .5s ease, transform .5s ease; }
    .hidden-ruler .ruler { opacity: 0; transform: translateY(30px); }
    .hidden-ruler .guide { opacity: 0; }
    .est { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .msg { font-size: clamp(17px, 3.2vw, 21px); font-weight: bold; color: #4527a0; text-align: center; }
    .unit-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .unit-item .name { font-size: clamp(24px, 5vw, 34px); font-weight: bold; }
    .ia-choice small { display: block; font-size: 15px; font-weight: normal; color: #777; }
  </style>
</head>
<body>
<div class="ia-app"></div>
<script src="../../../assets/interactive/engine.js"></script>
<script>
  var PX = 40, PAD = 26, RMAX = 15, W = RMAX * PX + PAD * 2;
  function X(cm) { return PAD + cm * PX; }

  function drawObject(kind, x0, len) {
    var x1 = x0 + len, y = 46, s = '';
    if (kind === 'pencil') {
      s += '<rect x="' + x0 + '" y="' + (y - 11) + '" width="14" height="22" rx="4" fill="#f48fb1" stroke="#ad1457" stroke-width="2"/>';
      s += '<rect x="' + (x0 + 12) + '" y="' + (y - 11) + '" width="10" height="22" fill="#b0bec5" stroke="#607d8b" stroke-width="2"/>';
      s += '<rect x="' + (x0 + 22) + '" y="' + (y - 11) + '" width="' + (len - 52) + '" height="22" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>';
      s += '<polygon points="' + (x1 - 30) + ',' + (y - 11) + ' ' + x1 + ',' + y + ' ' + (x1 - 30) + ',' + (y + 11) + '" fill="#ffe0b2" stroke="#bf8a4a" stroke-width="2"/>';
      s += '<polygon points="' + (x1 - 10) + ',' + (y - 3.7) + ' ' + x1 + ',' + y + ' ' + (x1 - 10) + ',' + (y + 3.7) + '" fill="#424242"/>';
    } else if (kind === 'crayon') {
      s += '<rect x="' + x0 + '" y="' + (y - 12) + '" width="' + (len - 24) + '" height="24" rx="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>';
      s += '<rect x="' + (x0 + 10) + '" y="' + (y - 12) + '" width="' + Math.max(8, len - 54) + '" height="24" fill="#90caf9" opacity=".7"/>';
      s += '<polygon points="' + (x1 - 26) + ',' + (y - 10) + ' ' + x1 + ',' + y + ' ' + (x1 - 26) + ',' + (y + 10) + '" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>';
    } else if (kind === 'leaf') {
      var st = Math.min(26, len * 0.2), mx = (x0 + st + x1) / 2, h = Math.min(30, len * 0.3);
      s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0 + st + 4) + '" y2="' + y + '" stroke="#5d4037" stroke-width="4" stroke-linecap="butt"/>';
      s += '<path d="M' + (x0 + st) + ',' + y + ' Q' + mx + ',' + (y - h * 1.6) + ' ' + x1 + ',' + y + ' Q' + mx + ',' + (y + h * 1.6) + ' ' + (x0 + st) + ',' + y + ' Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2.5"/>';
      s += '<line x1="' + (x0 + st) + '" y1="' + y + '" x2="' + (x1 - 6) + '" y2="' + y + '" stroke="#2e7d32" stroke-width="2"/>';
    } else if (kind === 'worm') {
      s += '<rect x="' + x0 + '" y="' + (y - 10) + '" width="' + len + '" height="20" rx="10" fill="#f8a5b5" stroke="#c2185b" stroke-width="2"/>';
      for (var i = x0 + 18; i < x1 - 16; i += 16) s += '<line x1="' + i + '" y1="' + (y - 8) + '" x2="' + i + '" y2="' + (y + 8) + '" stroke="#e57390" stroke-width="2"/>';
      s += '<circle cx="' + (x1 - 9) + '" cy="' + (y - 3) + '" r="2.5" fill="#333"/>';
    } else { // straw
      s += '<rect x="' + x0 + '" y="' + (y - 7) + '" width="' + len + '" height="14" fill="#fff" stroke="#e53935" stroke-width="2"/>';
      for (var j = x0 + 6; j < x1 - 6; j += 18) s += '<line x1="' + j + '" y1="' + (y + 7) + '" x2="' + (j + 10) + '" y2="' + (y - 7) + '" stroke="#e53935" stroke-width="4"/>';
    }
    return s;
  }
  var OBJECTS = [['pencil', 3], ['crayon', 2], ['leaf', 2], ['worm', 2], ['straw', 3]];

  function rulerSVG() {
    var s = '<g class="ruler"><rect x="4" y="96" width="' + (W - 8) + '" height="76" rx="6" fill="#fff3b0" stroke="#c9a227" stroke-width="2.5"/>';
    for (var c = 0; c <= RMAX; c++) {
      s += '<line x1="' + X(c) + '" y1="96" x2="' + X(c) + '" y2="128" stroke="#333" stroke-width="2.5"/>';
      s += '<text x="' + X(c) + '" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#333">' + c + '</text>';
      if (c < RMAX) s += '<line x1="' + (X(c) + PX / 2) + '" y1="96" x2="' + (X(c) + PX / 2) + '" y2="114" stroke="#555" stroke-width="1.5"/>';
    }
    s += '<text x="' + (W - 14) + '" y="168" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#7a6400">cm</text></g>';
    return s;
  }

  var UNITS = [
    ['a pencil', '✏️', 'cm'], ['a crayon', '🖍️', 'cm'], ['an ant', '🐜', 'cm'], ['a book', '📕', 'cm'], ['a spoon', '🥄', 'cm'],
    ['a leaf', '🍃', 'cm'], ['a shoe', '👟', 'cm'], ['a banana', '🍌', 'cm'], ['a key', '🔑', 'cm'], ['your finger', '☝️', 'cm'],
    ['a door', '🚪', 'm'], ['a school hallway', '🏫', 'm'], ['a soccer field', '⚽', 'm'], ['a school bus', '🚌', 'm'],
    ['a swimming pool', '🏊', 'm'], ['a tall tree', '🌳', 'm'], ['a whale', '🐋', 'm'], ['a playground', '🛝', 'm'], ['a train', '🚆', 'm']
  ];
  var unitBag = [];

  IA.game({
    id: 'g2m-ruler-lab',
    title: 'Ruler Lab',
    emoji: '📏',
    back: '../index.html',
    instructions: 'Estimate first, then measure with the ruler in centimetres (cm).',
    rounds: 10,
    levelTitle: 'Choose a level',
    levels: [
      { label: 'Start at 0', value: { mode: 'measure', zero: true }, desc: 'The object starts at 0 cm' },
      { label: 'Not at 0', value: { mode: 'measure', zero: false }, desc: 'Find the start and the end, then subtract' },
      { label: 'cm or m?', value: { mode: 'unit' }, desc: 'Choose the best unit' }
    ],
    round: function (r) {
      var lv = r.level;
      var hint = IA.el('div', { class: 'ia-hint', style: { display: 'none' } });
      if (lv.mode === 'unit') {
        if (!unitBag.length) unitBag = IA.shuffle(UNITS);
        var u = unitBag.pop();
        var q = 'Would you measure ' + u[0] + ' in centimetres or metres?';
        r.stage.appendChild(IA.el('div', { class: 'unit-item' }, [IA.el('span', { class: 'ia-emoji', role: 'img', 'aria-label': u[0] }, [u[1]]), IA.el('span', { class: 'name' }, [u[0].replace(/^(a|an) /, '')])]));
        r.stage.appendChild(IA.el('div', { class: 'ia-prompt' }, ['Which unit is better?', IA.speakButton(q)]));
        IA.say(q);
        var why = u[2] === 'cm' ? u[0].charAt(0).toUpperCase() + u[0].slice(1) + ' is small — it fits on a ruler, so we use centimetres.' : u[0].charAt(0).toUpperCase() + u[0].slice(1) + ' is big — much longer than a ruler, so we use metres. (1 m = 100 cm)';
        var rr = { answer: function (ok, el) { hint.textContent = '💡 ' + why; hint.style.display = ''; if (!ok) IA.say(why); return r.answer(ok, el); } };
        IA.choices(rr, r.stage, ['cm', 'm'], u[2], { render: function (o) {
          return IA.el('span', {}, [o === 'cm' ? 'cm' : 'm', IA.el('small', {}, [o === 'cm' ? 'centimetres — small things' : 'metres — big things'])]);
        } });
        r.stage.appendChild(hint);
        return;
      }
      var ob = IA.pick(OBJECTS);
      var start = lv.zero ? 0 : IA.rand(1, 5);
      var len = IA.rand(Math.max(ob[1], 3), Math.min(14, RMAX - start));
      var end = start + len;
      var objName = ob[0];

      var wrap = IA.el('div', { class: 'rwrap hidden-ruler' });
      var guides = '<g class="guide"><line x1="' + X(start) + '" y1="20" x2="' + X(start) + '" y2="100" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5 4"/>' +
                   '<line x1="' + X(end) + '" y1="20" x2="' + X(end) + '" y2="100" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5 4"/></g>';
      wrap.innerHTML = '<svg viewBox="0 0 ' + W + ' 180" role="img" aria-label="A ' + objName + ' above a centimetre ruler">' +
        rulerSVG() + guides + drawObject(objName, X(start), len * PX) +
        '<g class="hops"></g><g class="refsq"><rect x="' + X(0) + '" y="128" width="' + PX + '" height="' + PX + '" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/><text x="' + (X(1) + 8) + '" y="155" font-family="Arial" font-size="18" font-weight="bold" fill="#4527a0">← this square is 1 cm wide</text></g></svg>';
      var svg = wrap.firstChild;
      var hops = svg.querySelector('.hops');
      var prompt = IA.el('div', { class: 'ia-prompt' }, ['Estimate: how long is the ' + objName + '?', IA.speakButton('Estimate. About how long is the ' + objName + '?')]);
      r.stage.appendChild(prompt);
      r.stage.appendChild(wrap);
      IA.say('First, estimate. About how long is the ' + objName + '?');
      var area = IA.el('div', { class: 'ia-col' });
      r.stage.appendChild(area);
      r.stage.appendChild(hint);
      var bands = [['Less than 5 cm', function (n) { return n < 5; }], ['5 to 10 cm', function (n) { return n >= 5 && n <= 10; }], ['More than 10 cm', function (n) { return n > 10; }]];
      var est = IA.el('div', { class: 'est' });
      var guess = null;
      bands.forEach(function (b) {
        est.appendChild(IA.el('button', { class: 'ia-btn', type: 'button', onclick: function () { guess = b; IA.sfx.tap(); measure(); } }, ['🤔 ' + b[0]]));
      });
      area.appendChild(est);

      function measure() {
        IA.clear(area);
        svg.querySelector('.refsq').remove();
        wrap.classList.remove('hidden-ruler');
        prompt.firstChild.textContent = 'Now measure! How long is the ' + objName + '? ';
        var say = lv.zero ? 'Now measure with the ruler. How long is the ' + objName + '?' : 'Now measure. Where does the ' + objName + ' start? Where does it end? How long is it?';
        prompt.replaceChild(IA.speakButton(say), prompt.lastChild);
        IA.say(say);
        if (!lv.zero) area.appendChild(IA.el('div', { class: 'ia-sub' }, ['Careful! It does not start at 0. Find where it starts and where it ends.']));
        var opts = [len], cands = IA.shuffle(lv.zero ? [len + 1, len - 1, len + 2, len - 2] : [end, len + 1, len - 1, start]);
        cands.unshift(lv.zero ? len + 1 : end);
        cands.forEach(function (c) { if (c >= 1 && c <= 15 && opts.indexOf(c) < 0 && opts.length < 4) opts.push(c); });
        var rr = { answer: function (ok, el) {
          if (!ok) {
            showHops();
            hint.textContent = '💡 ' + (lv.zero ? 'It starts at 0 and ends at ' + end + '. That is ' + len + ' cm.' : 'It starts at ' + start + ' and ends at ' + end + '. ' + end + ' − ' + start + ' = ' + len + ' cm. Count the jumps!');
            hint.style.display = ''; IA.say(hint.textContent.replace('💡', ''));
            return r.answer(false, el);
          }
          var good = guess && guess[1](len);
          area.appendChild(IA.el('div', { class: 'msg' }, ['It is ' + len + ' cm long. ' + (good ? 'Your estimate "' + guess[0] + '" was great! 🎯' : 'You estimated "' + guess[0] + '". Good try — estimating gets easier!')]));
          return r.answer(true, el, len + ' cm! 📏');
        } };
        IA.choices(rr, area, IA.shuffle(opts), len, { render: function (o) { return o + ' cm'; } });
      }
      function showHops() {
        if (hops.childNodes.length) return;
        var s = '';
        for (var k = 0; k < len; k++) {
          var a = X(start + k), b = X(start + k + 1);
          s += '<path d="M' + a + ',94 Q' + ((a + b) / 2) + ',74 ' + b + ',94" fill="none" stroke="#e65100" stroke-width="2.5"/>';
          s += '<text x="' + ((a + b) / 2) + '" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100">' + (k + 1) + '</text>';
        }
        hops.innerHTML = s;
      }
    }
  });
</script>
</body>
</html>
