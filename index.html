<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Printable Practice Sheets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Comic Sans MS', 'Chalkboard SE', cursive; background: #fffdf5; color: #333; min-height: 100vh; }
    .container { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 28px; text-align: center; color: #e05c00; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: #888; margin-bottom: 32px; }
    .card-grid { display: flex; flex-direction: column; gap: 16px; }
    .card { display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: #fff; border: 2px solid #f0c040; border-radius: 14px; text-decoration: none; color: #333; transition: transform .12s, box-shadow .12s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .card-icon { font-size: 36px; flex-shrink: 0; }
    .card-body { flex: 1; }
    .card-title { font-size: 18px; font-weight: bold; color: #e05c00; }
    .card-desc { font-size: 12px; color: #777; margin-top: 2px; }
    .card-arrow { font-size: 22px; color: #ccc; flex-shrink: 0; }
    footer { text-align: center; margin-top: 40px; font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Printable Practice Sheets</h1>
    <p class="subtitle">AI-generated School &amp; Learning Open Practices — Printable Worksheets</p>

    <div class="card-grid">
      <a class="card" href="grade1/index.html">
        <span class="card-icon">🎒</span>
        <div class="card-body">
          <div class="card-title">Grade 1</div>
          <div class="card-desc">Reading, Math, and more for first graders</div>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a class="card" href="grade5/index.html">
        <span class="card-icon">📘</span>
        <div class="card-body">
          <div class="card-title">Grade 5</div>
          <div class="card-desc">Decimals, fractions, and more for fifth graders</div>
        </div>
        <span class="card-arrow">›</span>
      </a>
    </div>

    <footer>Open educational resources — print and practice!</footer>
  </div>
</body>
</html>
